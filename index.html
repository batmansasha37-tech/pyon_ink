<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PYON INK - Запись на сеанс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px #00FF00;
            margin-top: 10px;
        }
        .subtitle {
            font-size: 11px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, rgba(0,255,0,0) 0%, rgba(0,255,0,1) 50%, rgba(0,255,0,0) 100%);
            margin-bottom: 20px;
        }
        .section-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 14px;
            color: #00FF00;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .label {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
            display: block;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        .btn {
            background-color: rgba(20, 20, 20, 0.9);
            border: 2px solid #fff;
            color: #fff;
            padding: 12px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            border-radius: 6px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        /* Красная кнопка для записи с авансом */
        .btn-advance {
            border-color: #FF0000;
            background-color: rgba(255, 0, 0, 0.15);
            color: #FF5555;
            text-shadow: 0 0 5px #FF0000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
        }
        .btn-book {
            border-color: #00FF00;
            color: #00FF00;
            text-shadow: 0 0 5px #00FF00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="header">PYON INK</div>
    <div class="subtitle">Студия художественной татуировки</div>
    <div class="divider"></div>

    <!-- Блок календаря и записи -->
    <div class="section-card">
        <div class="section-title">📅 Выбор даты и времени (с 11:00)</div>
        
        <label class="label">Календарь на месяц (выбери день):</label>
        <input type="date" id="bookingDate">

        <label class="label">Время сеанса:</label>
        <select id="bookingTime">
            <option value="11:00">11:00 (Утренний сеанс)</option>
            <option value="14:00">14:00 (Дневной сеанс)</option>
            <option value="17:00">17:00 (Вечерний сеанс)</option>
        </select>

        <!-- Красная кнопка для записи с авансом -->
        <button class="btn btn-advance" onclick="submitBooking('with_advance')">🔥 ЗАПИСАТЬСЯ С АВАНСОМ (Гарантия)</button>
        
        <!-- Обычная кнопка (без аванса, на усмотрение админа) -->
        <button class="btn btn-book" onclick="submitBooking('without_advance')">⚡ Записаться без аванса (Ожидание)</button>
    </div>

    <!-- Помощник по эскизам и консультация -->
    <div class="section-card">
        <div class="section-title">💡 Помощник по эскизам</div>
        <label class="label">Опиши свою идею для тату:</label>
        <textarea id="sketchIdea" rows="2" placeholder="Например: киберпанк тигр на предплечье..."></textarea>
        <button class="btn" onclick="searchSketch()">🔍 Найти референсы (Pinterest)</button>
    </div>

    <!-- Адрес и контакты -->
    <div class="section-card">
        <div class="section-title">📍 Адрес студии</div>
        <button class="btn" onclick="openAddress()">🗺️ Открыть в Яндекс.Картах</button>
        <button class="btn" onclick="consultMaster()">💬 Консультация с мастером</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        function submitBooking(type) {
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            if (!date) {
                alert("Пожалуйста, выберите дату в календаре!");
                return;
            }

            const payload = JSON.stringify({
                action: "new_booking",
                date: date,
                time: time,
                type: type
            });

            if (tg && tg.sendData) {
                tg.sendData(payload);
            } else {
                alert("Тест (вне Telegram) [Тип: " + type + "]: Дата " + date + " на " + time);
            }
        }

        function searchSketch() {
            const query = document.getElementById('sketchIdea').value.trim();
            const url = query ? `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(query + ' tattoo')}` : "https://www.pinterest.com/";
            if (tg) { tg.openLink(url); } else { window.open(url, "_blank"); }
        }

        function openAddress() {
            const mapUrl = "https://yandex.ru/maps/";
            if (tg) { tg.openLink(mapUrl); } else { window.open(mapUrl, "_blank"); }
        }

        function consultMaster() {
            if (tg) {
                tg.sendData(JSON.stringify({ action: "consultation" }));
            } else {
                alert("Запрос на консультацию отправлен мастеру.");
            }
        }
    </script>
</body>
</html>
