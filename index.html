<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PYON INK Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 28px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px #00FF00, 0 0 20px #00FF00;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .divider {
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, rgba(0,255,0,0) 0%, rgba(0,255,0,1) 50%, rgba(0,255,0,0) 100%);
            margin-bottom: 40px;
        }
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 85%;
            max-width: 350px;
        }
        .btn {
            background-color: rgba(20, 20, 20, 0.9);
            border: 2px solid #fff;
            color: #fff;
            padding: 18px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-book {
            border-color: #00FF00;
            color: #00FF00;
            text-shadow: 0 0 5px #00FF00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="header">PYON INK</div>
    <div class="subtitle">Tattoo Studio</div>
    <div class="divider"></div>
    
    <div class="main-menu">
        <button class="btn btn-book" onclick="startBooking()">⚡ ЗАПИСАТЬСЯ НА СЕАНС</button>
        <button class="btn" onclick="openPortfolio()">🖼️ ПОРТФОЛИО РАБОТ</button>
        <button class="btn" onclick="openAddress()">📍 АДРЕС СТУДИИ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function startBooking() {
            tg.sendData("start_booking");
        }
        function openPortfolio() {
            tg.sendData("open_portfolio");
        }
        function openAddress() {
            tg.sendData("open_address");
        }
    </script>
</body>
</html>
