<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PYON INK - Запись на сеанс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 28px;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px #ffffff;
            margin-top: 10px;
        }
        .subtitle {
            font-size: 13px;
            color: #aaaaaa;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .divider {
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, rgba(255,0,0,0) 0%, rgba(255,0,0,1) 50%, rgba(255,0,0,0) 100%);
            margin-bottom: 25px;
        }
        .section-card {
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .label {
            font-size: 13px;
            color: #cccccc;
            margin-top: 10px;
            display: block;
            text-transform: uppercase;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #0a0a0a;
            border: 2px solid #444444;
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }
        input[type="date"] {
            color-scheme: dark;
        }
        .btn {
            background-color: #111111;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 16px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            border-radius: 8px;
            margin-top: 12px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        /* АДСКИ КРАСНАЯ КНОПКА АВАНСА */
        .btn-advance {
            border-color: #FF0000;
            background-color: #FF0000;
            color: #ffffff;
            font-size: 16px;
            text-shadow: 0 0 8px #000000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
        .btn-book {
            border-color: #00FF00;
            color: #00FF00;
            background-color: rgba(0, 255, 0, 0.1);
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="header">PYON INK</div>
    <div class="subtitle">Студия художественной татуировки</div>
    <div class="divider"></div>

    <!-- Блок календаря и записи -->
    <div class="section-card">
        <div class="section-title">📅 Выбор даты и времени (с 11:00)</div>
        
        <label class="label">Выбери дату на месяц:</label>
        <input type="date" id="bookingDate">

        <label class="label">Время сеанса:</label>
        <select id="bookingTime">
            <option value="11:00">11:00 (Утренний сеанс)</option>
            <option value="14:00">14:00 (Дневной сеанс)</option>
            <option value="17:00">17:00 (Вечерний сеанс)</option>
        </select>

        <label class="label">Прикрепить фото идеи (эскиз/референс):</label>
        <input type="file" id="clientPhoto" accept="image/*">

        <!-- КРАСНАЯ КНОПКА АВАНСА -->
        <button class="btn btn-advance" onclick="submitBooking('with_advance')">🔥 ЗАПИСАТЬСЯ С АВАНСОМ</button>
        
        <!-- Кнопка без аванса -->
        <button class="btn btn-book" onclick="submitBooking('without_advance')">⚡ Записаться без аванса</button>
    </div>

    <!-- Помощник по эскизам (Pinterest) -->
    <div class="section-card">
        <div class="section-title">💡 Поиск эскизов</div>
        <label class="label">Опиши идею для поиска:</label>
        <textarea id="sketchIdea" rows="2" placeholder="Например: киберпанк рукав..."></textarea>
        <button class="btn" onclick="searchSketch()">🔍 Найти в Pinterest</button>
    </div>

    <!-- Адрес и консультация в СМС (Telegram) -->
    <div class="section-card">
        <div class="section-title">📍 Связь и адрес</div>
        <button class="btn" onclick="openAddress()">🗺️ Адрес (Яндекс.Карты)</button>
        <button class="btn" onclick="consultMaster()">💬 Консультация с мастером (SMS)</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        function submitBooking(type) {
            const date = document.getElementById('bookingDate').value;
            const timeElement = document.getElementById('bookingTime');
            const time = timeElement ? timeElement.value : "11:00";

            if (!date) {
                alert("Пожалуйста, выбери дату в календаре!");
                return;
            }

            const payload = JSON.stringify({
                action: "new_booking",
                date: date,
                time: time,
                type: type
            });

            if (tg && tg.sendData) {
                tg.sendData(payload);
            } else {
                alert("Тест (вне Telegram) [Тип: " + type + "]: Дата " + date + " на " + time);
            }
        }

        function searchSketch() {
            const query = document.getElementById('sketchIdea').value.trim();
            const url = query ? `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(query + ' tattoo')}` : "https://www.pinterest.com/";
            if (tg) { tg.openLink(url); } else { window.open(url, "_blank"); }
        }

        function openAddress() {
            const mapUrl = "https://yandex.ru/maps/";
            if (tg) { tg.openLink(mapUrl); } else { window.open(mapUrl, "_blank"); }
        }

        function consultMaster() {
            const masterChatUrl = "https://t.me/batmansasha37_tech"; 
            if (tg) {
                tg.openTelegramLink(masterChatUrl);
            } else {
                window.open(masterChatUrl, "_blank");
            }
        }
    </script>
</body>
</html>
